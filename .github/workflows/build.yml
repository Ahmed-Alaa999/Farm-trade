name: Build Android Project

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --stacktrace > build.log || true

    - name: Generate Build Summary
      if: always()
      run: |
        echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        if [ -f build.log ]; then
          grep -E "^e: |error:|\.kt:[0-9]+|FAILED|What went wrong" -A4 build.log | head -200 || true
        else
          echo "build.log not found"
        fi
        echo '```' >> "$GITHUB_STEP_SUMMARY"
