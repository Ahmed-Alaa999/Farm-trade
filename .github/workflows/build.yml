name: Build Android Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee build.log
      continue-on-error: true

    - name: Generate Build Summary
      if: always()
      run: |
        echo "## Build errors and logs" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        if [ -f build.log ]; then
          tail -n 100 build.log || true
        else
          echo "build.log still not found"
        fi
        echo '```' >> "$GITHUB_STEP_SUMMARY"
